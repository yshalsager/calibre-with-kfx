name: Publish Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - 'mise.toml'
      - 'mise.tracking.toml'
      - 'mise.tracking.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/download-locked.sh'
      - 'patches/**'
      - 'entrypoint.sh'
      - 'test.sh'
      - '.github/workflows/publish.yml'
    branches:
      - master

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Build, test, and publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.11.0'
          install: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read locked versions
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(date -u +'%Y%m%d-%H%M%S')"
          versions=$(mise run --quiet --output=interleave versions)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'release_body<<EOF'
            printf '[ghcr.io/%s:%s](https://ghcr.io/%s) Built using:\n' "$REPOSITORY" "$version" "$REPOSITORY"
            printf '%s\n' "$versions" | sed 's/^/- /'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build locked image
        run: mise run build
      - name: Test conversions
        env:
          IMAGE: calibre-with-kfx:local
        run: mise run test

      - name: Push tested image and tag
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          images=("$REPOSITORY:$VERSION" "ghcr.io/$REPOSITORY:$VERSION")
          if [[ "$(git rev-parse HEAD)" == "$(git ls-remote origin refs/heads/master | cut -f1)" ]]; then
            images+=("$REPOSITORY:latest" "ghcr.io/$REPOSITORY:latest")
          fi
          for image in "${images[@]}"; do
            docker tag calibre-with-kfx:local "$image"
            docker push "$image"
          done
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          body: ${{ steps.metadata.outputs.release_body }}

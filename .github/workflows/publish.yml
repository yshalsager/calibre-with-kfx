name: Publish Docker image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'
  push:
    paths:
      - 'mise.toml'
      - 'mise.tracking.toml'
      - 'mise.tracking.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/download-locked.sh'
      - 'patches/**'
      - 'entrypoint.sh'
      - 'test.sh'
      - 'tests/**'
      - '.github/workflows/publish.yml'
    branches:
      - master

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Build, test, and publish
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.0'
          install: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read locked versions
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(date -u +'%Y%m%d-%H%M%S')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'release_body<<EOF'
            for variant in full slim; do
              suffix=''
              if [[ "$variant" == slim ]]; then suffix=-slim; fi
              printf '## %s\n[ghcr.io/%s:%s%s](https://ghcr.io/%s) Built using:\n' "$variant" "$REPOSITORY" "$version" "$suffix" "$REPOSITORY"
              VARIANT="$variant" mise run --quiet --output=interleave versions | sed 's/^/- /'
              echo
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build locked slim image
        env:
          VARIANT: slim
        run: mise run build
      - name: Test slim conversions
        env:
          VARIANT: slim
        run: mise run test
      - name: Build locked full image
        run: mise run build
      - name: Test full conversions
        run: mise run test

      - name: Push tested image and tag
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          latest=$(git ls-remote origin refs/heads/master | cut -f1)
          for variant in full slim; do
            source=calibre-with-kfx:local
            suffix=''
            if [[ "$variant" == slim ]]; then
              source=calibre-with-kfx:slim-local
              suffix=-slim
            fi
            for registry in "$REPOSITORY" "ghcr.io/$REPOSITORY"; do
              images=("$registry:$VERSION$suffix")
              if [[ "$(git rev-parse HEAD)" == "$latest" ]]; then
                images+=("$registry:$variant")
                if [[ "$variant" == full ]]; then images+=("$registry:latest"); fi
              fi
              for image in "${images[@]}"; do
                docker tag "$source" "$image"
                docker push "$image"
              done
            done
          done
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          body: ${{ steps.metadata.outputs.release_body }}

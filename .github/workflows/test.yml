name: Test converting

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Image tag (include -slim for dated slim images)'
        required: true
        type: string
      variant:
        description: 'Image variant'
        type: choice
        options:
          - full
          - slim
        default: full

permissions:
  contents: read

jobs:
  tracking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.0'
          install: false
      - run: mise run test-tracking
      - name: Test published image
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tags }}
          VARIANT: ${{ inputs.variant }}
        run: |
          docker pull "$IMAGE"
          mise run test
